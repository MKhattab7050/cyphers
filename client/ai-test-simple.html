<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quick Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            margin-bottom: 15px;
            transition: border 0.3s;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
        button:active {
            transform: translateY(0);
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .response {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            min-height: 100px;
            display: none;
        }
        .response.show {
            display: block;
            animation: slideIn 0.3s ease-out;
        }
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .response h3 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        .response p {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }
        .error {
            border-left-color: #e74c3c;
        }
        .error h3 {
            color: #e74c3c;
        }
        .loading {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
        .loading.show {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .meta {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #ddd;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🤖 AI Quick Test</h1>
        <p class="subtitle">Test if AI responds properly</p>
        
        <input type="text" id="question" placeholder="Type your question here..." value="hello, who are you?">
        <button onclick="testAI()" id="testBtn">Send to AI</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="margin-top: 10px; color: #667eea;">AI is thinking...</p>
        </div>
        
        <div class="response" id="response"></div>
    </div>

    <script>
        async function testAI() {
            const question = document.getElementById('question').value.trim();
            const responseDiv = document.getElementById('response');
            const loadingDiv = document.getElementById('loading');
            const testBtn = document.getElementById('testBtn');
            
            if (!question) {
                alert('Please enter a question');
                return;
            }
            
            // Show loading
            responseDiv.classList.remove('show');
            loadingDiv.classList.add('show');
            testBtn.disabled = true;
            
            console.log('[AI Test] Sending request:', question);
            
            try {
                const startTime = Date.now();
                
                const response = await fetch('/api/ai', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [
                            { role: 'user', content: question }
                        ]
                    })
                });
                
                const duration = Date.now() - startTime;
                console.log('[AI Test] Response received in', duration, 'ms');
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `HTTP ${response.status}`);
                }
                
                const data = await response.json();
                console.log('[AI Test] Success:', data);
                
                // Display response
                responseDiv.className = 'response show';
                responseDiv.innerHTML = `
                    <h3>✅ AI Response</h3>
                    <p>${escapeHtml(data.reply)}</p>
                    <div class="meta">
                        <strong>Model:</strong> ${escapeHtml(data.model || 'unknown')}<br>
                        <strong>Provider:</strong> ${escapeHtml(data.provider || 'unknown')}<br>
                        <strong>Response Time:</strong> ${duration}ms
                    </div>
                `;
                
            } catch (error) {
                console.error('[AI Test] Error:', error);
                
                responseDiv.className = 'response show error';
                responseDiv.innerHTML = `
                    <h3>❌ Error</h3>
                    <p>${escapeHtml(error.message)}</p>
                    <div class="meta">
                        <strong>Check browser console (F12) for details</strong>
                    </div>
                `;
            } finally {
                loadingDiv.classList.remove('show');
                testBtn.disabled = false;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        // Allow Enter key
        document.getElementById('question').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                testAI();
            }
        });
        
        console.log('🤖 AI Test Page Loaded');
        console.log('Server endpoint: /api/ai');
    </script>
</body>
</html>
